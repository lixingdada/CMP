# ============================================================
# Nginx：前端静态资源 + 后端反向代理
#   浏览器只访问 80 端口，/api 由 Nginx 转发到后端，
#   因此前后端同源，不需要 CORS，也不需要把后端端口暴露给外网。
# ============================================================

# 双实例轮询。对照原版：原版部署两个 Tomcat 后必须解决 session 共享
# （要么 ip_hash 粘滞，要么 session 复制）；这里登录态改成无状态 JWT，
# 两台实例只要共用同一个 JWT_SECRET 即可，无需任何会话同步。
upstream cmp_backend {
    server server1:8080 max_fails=2 fail_timeout=10s;
    server server2:8080 max_fails=2 fail_timeout=10s;

    # 与后端保持长连接，避免每次请求都重新三次握手
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    client_max_body_size 10m;

    # 隐藏版本号，减少信息暴露
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---------- 前端 ----------
    # history 模式路由（/orders、/products/xxx）都要回退到 index.html，
    # 否则刷新页面会拿到 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带 hash 的构建产物可以长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html 不能缓存，否则前端发版后用户仍加载旧入口
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ---------- 后端 ----------
    # 注意 proxy_pass 后面不带 URI，保留 /api 前缀原样转发
    location /api/ {
        proxy_pass http://cmp_backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 配合 upstream 的 keepalive：清空 Connection 头才复用长连接
        proxy_set_header Connection "";

        proxy_connect_timeout 3s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;

        # 让前端能读到链路追踪号，用户报错时把它发过来即可定位日志
        proxy_pass_header X-Trace-Id;
    }

    # 健康检查与监控端点不对外暴露，只允许容器内部访问
    location /actuator/ {
        deny all;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy no-referrer-when-downgrade;
}
