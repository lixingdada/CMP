# ============================================================
# 一键启动整套环境：
#   cd deploy && cp .env.example .env && docker compose up -d --build
# 访问 http://localhost
#
# 服务拓扑：
#   web(nginx:80)  ──反代──▶  server1:8080 / server2:8080  ──▶  mysql:3306
#
# 说明：server1 与 server2 的配置故意写全而不是用 YAML 锚点（<<）合并。
# 锚点合并键属于 YAML 1.1 扩展，Docker Compose 支持，但换成其他 YAML 工具
# （编辑器插件、k8s 转换脚本）可能读不出合并后的内容。两台实例的配置完全一致，
# 差异只在容器名，这里展开写以保证任何解析器都能正确理解。
# ============================================================

services:
  # ---------------- 数据库 ----------------
  mysql:
    image: mysql:8.0
    container_name: cmp-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cmp_root_pwd}
      MYSQL_DATABASE: cmp_2
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
      # 只在数据目录为空（首次启动）时执行，之后重启不会覆盖已有数据
      - ../schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    ports:
      # 只绑本机，方便用 DBeaver 连进去调试；生产环境可删掉这一段
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - cmp-net

  # ---------------- 后端实例 1 ----------------
  server1:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    container_name: cmp-server1
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: cmp_2
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cmp_root_pwd}
      DB_POOL_SIZE: "15"
      # 两实例必须共用同一密钥，否则 A 实例签发的 token 到 B 实例校验不过
      JWT_SECRET: ${JWT_SECRET:-cmp-mall-change-this-secret-in-production-please-0123456789}
      JWT_EXPIRE_MINUTES: "120"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cmp-net

  # ---------------- 后端实例 2 ----------------
  server2:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    container_name: cmp-server2
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: cmp_2
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-cmp_root_pwd}
      DB_POOL_SIZE: "15"
      JWT_SECRET: ${JWT_SECRET:-cmp-mall-change-this-secret-in-production-please-0123456789}
      JWT_EXPIRE_MINUTES: "120"
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cmp-net

  # ---------------- 前端 + 反向代理 ----------------
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: cmp-web
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      server1:
        condition: service_healthy
      server2:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cmp-net

networks:
  cmp-net:
    driver: bridge

volumes:
  mysql-data:
